groups:
  - name: llmops
    rules:
      - alert: HighErrorRate
        expr: rate(llm_requests_total{status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High LLM error rate"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "LLM P95 latency > 10s"

      - alert: BudgetThreshold
        expr: sum(llm_cost_dollars_total) > 50
        labels:
          severity: critical
        annotations:
          summary: "LLM cost exceeded $50 budget"
